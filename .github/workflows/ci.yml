name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          check-latest: true

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go code is not formatted:"
            gofmt -d .
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

  staticcheck:
    name: Staticcheck
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          check-latest: true

      - name: Run Staticcheck
        run: make staticcheck

  test:
    name: Test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          check-latest: true

      - name: Run tests
        run: go test -v -race ./...

      - name: Run parser fuzz smoke
        run: make fuzz-smoke

      - name: Run coverage threshold
        run: make coverage

  native-pam:
    name: Native PAM
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run native PAM unit tests
        run: |
          make native-pam-fmt
          make native-pam-test

      - name: Build native PAM module
        run: make native-pam-build

      - name: Check native PAM shared-library dependencies
        run: make native-pam-deps

  smoke:
    name: Smoke
    needs: [lint, staticcheck, test, native-pam]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          check-latest: true

      - name: Build local binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -ldflags "-X github.com/phillipmcmahon/pwned-check/internal/pwned.Version=${GITHUB_SHA}" -o dist/pwned-check ./cmd/pwned-check
          go build -o dist/pwned-check-pam-helper ./cmd/pwned-check-pam-helper

      - name: Run binary smoke
        run: go run ./scripts/smoke_binary.go dist/pwned-check

      - name: Run Docker distro smoke
        run: ./scripts/docker-smoke.sh --platform linux/amd64

      - name: Run Docker PAM package smoke
        run: ./scripts/docker-pam-smoke.sh --platform linux/amd64

      - name: Upload smoke binaries
        uses: actions/upload-artifact@v7
        with:
          name: pwned-check-smoke-linux-amd64
          path: |
            dist/pwned-check
            dist/pwned-check-pam-helper

  package-linux:
    name: Package Linux (${{ matrix.goarch }})
    needs: [lint, staticcheck, test, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          check-latest: true

      - name: Set version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="dev-${GITHUB_SHA::8}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Package Linux artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail
          BASENAME="$(scripts/package-linux-artifact.sh \
            --version "${{ steps.version.outputs.version }}" \
            --goarch "${{ matrix.goarch }}" \
            --output-dir "$PWD/dist/release")"
          echo "basename=${BASENAME}" >> "$GITHUB_OUTPUT"

      - name: Upload Linux package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.basename }}
          path: |
            dist/release/${{ steps.package.outputs.basename }}.tar.gz
            dist/release/${{ steps.package.outputs.basename }}.tar.gz.sha256

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          check-latest: true

      - name: Run release parser fuzz
        run: make fuzz-release

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f -name '*.tar.gz' -exec cp {} release/ \;
          find artifacts -type f -name '*.tar.gz.sha256' -exec cp {} release/ \;
          cd release
          sha256sum *.tar.gz > SHA256SUMS.txt

      - name: Attest release provenance
        uses: actions/attest@v4
        with:
          subject-checksums: release/SHA256SUMS.txt

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > "${NOTES_FILE}"
          for heading in "## Highlights" "## Operator impact" "## Validation"; do
            if ! grep -F "${heading}" "${NOTES_FILE}" >/dev/null; then
              echo "::error::release notes from ${GITHUB_REF_NAME} are missing ${heading}"
              sed -n '1,120p' "${NOTES_FILE}"
              exit 1
            fi
          done
          gh release create "${GITHUB_REF_NAME}" release/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "${NOTES_FILE}" \
            --verify-tag
