name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Check for private signing material
        run: make private-signing-material-guard-test ci-repository-signing-keys-test package-repository-pages-publish-test native-pam-repo-endpoint-retry-test private-signing-material-check

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          check-latest: true

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go code is not formatted:"
            gofmt -d .
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

  staticcheck:
    name: Staticcheck
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          check-latest: true

      - name: Run Staticcheck
        run: make staticcheck

  test:
    name: Test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          check-latest: true

      - name: Run tests
        run: go test -v -race ./...

      - name: Run parser fuzz smoke
        run: make fuzz-smoke

      - name: Run coverage threshold
        run: make coverage

  native-pam:
    name: Native PAM
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install PAM development headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc libpam0g-dev valgrind

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run native PAM unit tests
        run: |
          make native-pam-fmt
          make native-pam-test
          make native-pam-memory-check

      - name: Build native PAM module
        run: make native-pam-build

      - name: Check native PAM shared-library dependencies
        run: make native-pam-deps

      - name: Check native PAM exported symbols
        run: make native-pam-symbols

      - name: Run native PAM integration harness
        run: make native-pam-harness

  smoke:
    name: Smoke
    needs: [lint, staticcheck, test, native-pam]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          check-latest: true

      - name: Set up QEMU for arm64 smoke
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Build local binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          LDFLAGS="-X github.com/phillipmcmahon/pwned-check/internal/pwned.Version=${GITHUB_SHA}"
          go build -ldflags "${LDFLAGS}" -o dist/pwned-check ./cmd/pwned-check

      - name: Run binary smoke
        run: go run ./scripts/smoke_binary.go dist/pwned-check

      - name: Run Docker distro smoke
        run: ./scripts/docker-smoke.sh --platform linux/amd64

      - name: Run Docker distro smoke arm64
        run: ./scripts/docker-smoke.sh --platform linux/arm64 --images "debian:stable-slim ubuntu:24.04 fedora:latest rockylinux/rockylinux:10.1 alpine:3.22"

      - name: Upload smoke binaries
        uses: actions/upload-artifact@v7
        with:
          name: pwned-check-smoke-linux-amd64
          path: |
            dist/pwned-check

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, staticcheck, test, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      PWNED_CHECK_HAS_REPOSITORY_SIGNING_SECRETS: ${{ secrets.PWNED_CHECK_CI_OPENPGP_PUBLIC_KEY != '' && secrets.PWNED_CHECK_CI_OPENPGP_SECRET_KEY != '' && secrets.PWNED_CHECK_CI_OPENPGP_FINGERPRINT != '' && secrets.PWNED_CHECK_CI_OPENPGP_PASSPHRASE != '' && secrets.PWNED_CHECK_CI_ALPINE_PRIVATE_KEY != '' && secrets.PWNED_CHECK_CI_ALPINE_PUBLIC_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          check-latest: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Install native PAM package dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc libpam0g-dev libpam-runtime dpkg-dev rpm zstd

      - name: Run release parser fuzz
        run: make fuzz-release

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          SOURCE_EPOCH="$(git log -1 --format=%ct "${GITHUB_REF_NAME}")"
          BUILD_TIME="$(git log -1 --format=%cI "${GITHUB_REF_NAME}")"
          for platform in linux/amd64 linux/arm64; do
            scripts/build-native-pam-release-assets.sh \
              --version "${GITHUB_REF_NAME#v}" \
              --output-dir release \
              --source-date-epoch "${SOURCE_EPOCH}" \
              --build-time "${BUILD_TIME}" \
              --platform "${platform}"
          done
          if ! find release -maxdepth 1 -type f -print -quit | grep -q .; then
            echo "no release assets were produced" >&2
            exit 1
          fi
          cd release
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Check release assets for private signing material
        run: ./scripts/check-no-private-signing-material.sh release

      - name: Prepare repository signing keys
        id: repository-signing-keys
        if: env.PWNED_CHECK_HAS_REPOSITORY_SIGNING_SECRETS == 'true'
        shell: bash
        env:
          PWNED_CHECK_CI_OPENPGP_PUBLIC_KEY: ${{ secrets.PWNED_CHECK_CI_OPENPGP_PUBLIC_KEY }}
          PWNED_CHECK_CI_OPENPGP_SECRET_KEY: ${{ secrets.PWNED_CHECK_CI_OPENPGP_SECRET_KEY }}
          PWNED_CHECK_CI_OPENPGP_FINGERPRINT: ${{ secrets.PWNED_CHECK_CI_OPENPGP_FINGERPRINT }}
          PWNED_CHECK_CI_OPENPGP_PASSPHRASE: ${{ secrets.PWNED_CHECK_CI_OPENPGP_PASSPHRASE }}
          PWNED_CHECK_CI_ALPINE_PRIVATE_KEY: ${{ secrets.PWNED_CHECK_CI_ALPINE_PRIVATE_KEY }}
          PWNED_CHECK_CI_ALPINE_PUBLIC_KEY: ${{ secrets.PWNED_CHECK_CI_ALPINE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          scripts/prepare-ci-repository-signing-keys.sh \
            --output-dir "${RUNNER_TEMP}/pwned-check-repository-signing-keys"

      - name: Generate signed repositories dry run
        if: env.PWNED_CHECK_HAS_REPOSITORY_SIGNING_SECRETS == 'true'
        shell: bash
        env:
          PWNED_CHECK_SIGNING_KEY_DIR: ${{ steps.repository-signing-keys.outputs['key-dir'] }}
          PWNED_CHECK_OPENPGP_SECRET_KEY_FILE: ${{ steps.repository-signing-keys.outputs['openpgp-secret-key-file'] }}
          PWNED_CHECK_REPOSITORY_DOCKER_STAGE: ${{ runner.temp }}/pwned-check-repository-docker-stage
        run: |
          set -euo pipefail
          scripts/build-native-pam-repositories-docker.sh \
            --input-dir release \
            --output-root "${RUNNER_TEMP}/pwned-check-repository-output"
          scripts/check-no-private-signing-material.sh \
            "${RUNNER_TEMP}/pwned-check-repository-output/package-repositories"

      - name: Publish signed repositories to gh-pages
        if: env.PWNED_CHECK_HAS_REPOSITORY_SIGNING_SECRETS == 'true'
        shell: bash
        run: |
          set -euo pipefail
          scripts/publish-package-repositories-to-pages.sh \
            --repository-dir "${RUNNER_TEMP}/pwned-check-repository-output/package-repositories" \
            --worktree "${RUNNER_TEMP}/pwned-check-gh-pages" \
            --remote origin \
            --branch gh-pages \
            --message "Publish package repositories for ${GITHUB_REF_NAME}"

      - name: Validate published repository endpoints
        if: env.PWNED_CHECK_HAS_REPOSITORY_SIGNING_SECRETS == 'true'
        run: scripts/native-pam-repo-endpoint-check-retry.sh

      - name: Report skipped repository dry run
        if: env.PWNED_CHECK_HAS_REPOSITORY_SIGNING_SECRETS != 'true'
        run: echo "Repository signing secrets are not configured; signed repository dry run skipped."

      - name: Attest release provenance
        uses: actions/attest@v4
        with:
          subject-checksums: release/SHA256SUMS.txt

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          {
            git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents:subject)'
            printf '\n'
            git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents:body)'
          } > "${NOTES_FILE}"
          for heading in "Highlights" "Operator impact" "Validation"; do
            if ! grep -E "^##[[:space:]]+${heading}$" "${NOTES_FILE}" >/dev/null; then
              echo "::error::release notes from ${GITHUB_REF_NAME} are missing ## ${heading}"
              sed -n '1,120p' "${NOTES_FILE}"
              exit 1
            fi
          done
          gh release create "${GITHUB_REF_NAME}" release/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "${NOTES_FILE}" \
            --verify-tag
