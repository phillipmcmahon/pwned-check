name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          check-latest: true
      - run: pip install -e ".[dev,build]"
      - run: ruff check .
      - run: pytest -q
      - run: python scripts/build_binary.py
      - run: python scripts/smoke_binary.py
      - uses: actions/upload-artifact@v7
        with:
          name: pwned-check-${{ runner.os }}
          path: dist/pwned-check*
