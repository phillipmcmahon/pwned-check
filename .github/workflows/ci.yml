name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          check-latest: true

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go code is not formatted:"
            gofmt -d .
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck ./...

  test:
    name: Test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          check-latest: true

      - name: Run tests
        run: go test -v -race ./...

  smoke:
    name: Smoke
    needs: [lint, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          check-latest: true

      - name: Build local binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -ldflags "-X github.com/phillipmcmahon/pwned-check/internal/pwned.Version=${GITHUB_SHA}" -o dist/pwned-check ./cmd/pwned-check
          go build -o dist/pwned-check-pam-helper ./cmd/pwned-check-pam-helper

      - name: Run binary smoke
        run: go run ./scripts/smoke_binary.go dist/pwned-check

      - name: Run Docker distro smoke
        run: ./scripts/docker-smoke.sh --platform linux/amd64

      - name: Upload smoke binaries
        uses: actions/upload-artifact@v7
        with:
          name: pwned-check-smoke-linux-amd64
          path: |
            dist/pwned-check
            dist/pwned-check-pam-helper

  cross-build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: [lint, test, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            output: pwned-check-linux-amd64
            helper: pwned-check-pam-helper-linux-amd64
          - goos: linux
            goarch: arm64
            output: pwned-check-linux-arm64
            helper: pwned-check-pam-helper-linux-arm64
          - goos: darwin
            goarch: arm64
            output: pwned-check-darwin-arm64
            helper: pwned-check-pam-helper-darwin-arm64
          - goos: windows
            goarch: amd64
            output: pwned-check-windows-amd64.exe
            helper: pwned-check-pam-helper-windows-amd64.exe
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          check-latest: true

      - name: Build binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -ldflags "-X github.com/phillipmcmahon/pwned-check/internal/pwned.Version=${GITHUB_SHA}" -o "dist/${{ matrix.output }}" ./cmd/pwned-check
          go build -o "dist/${{ matrix.helper }}" ./cmd/pwned-check-pam-helper

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.output }}
          path: |
            dist/${{ matrix.output }}
            dist/${{ matrix.helper }}
