name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          check-latest: true

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go code is not formatted:"
            gofmt -d .
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck ./...

  test:
    name: Test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          check-latest: true

      - name: Run tests
        run: go test -v -race ./...

      - name: Run parser fuzz smoke
        run: make fuzz-smoke

  smoke:
    name: Smoke
    needs: [lint, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          check-latest: true

      - name: Build local binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -ldflags "-X github.com/phillipmcmahon/pwned-check/internal/pwned.Version=${GITHUB_SHA}" -o dist/pwned-check ./cmd/pwned-check
          go build -o dist/pwned-check-pam-helper ./cmd/pwned-check-pam-helper

      - name: Run binary smoke
        run: go run ./scripts/smoke_binary.go dist/pwned-check

      - name: Run Docker distro smoke
        run: ./scripts/docker-smoke.sh --platform linux/amd64

      - name: Run Docker PAM package smoke
        run: ./scripts/docker-pam-smoke.sh --platform linux/amd64

      - name: Upload smoke binaries
        uses: actions/upload-artifact@v7
        with:
          name: pwned-check-smoke-linux-amd64
          path: |
            dist/pwned-check
            dist/pwned-check-pam-helper

  cross-build:
    name: Non-Linux Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: [lint, test, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            output: pwned-check-darwin-arm64
            helper: pwned-check-pam-helper-darwin-arm64
          - goos: windows
            goarch: amd64
            output: pwned-check-windows-amd64.exe
            helper: pwned-check-pam-helper-windows-amd64.exe
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          check-latest: true

      - name: Build binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -ldflags "-X github.com/phillipmcmahon/pwned-check/internal/pwned.Version=${GITHUB_SHA}" -o "dist/${{ matrix.output }}" ./cmd/pwned-check
          go build -o "dist/${{ matrix.helper }}" ./cmd/pwned-check-pam-helper

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.output }}
          path: |
            dist/${{ matrix.output }}
            dist/${{ matrix.helper }}

  package-linux:
    name: Package Linux (${{ matrix.goarch }})
    needs: [lint, test, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          check-latest: true

      - name: Set version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="dev-${GITHUB_SHA::8}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Package Linux artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail
          BASENAME="$(scripts/package-linux-artifact.sh \
            --version "${{ steps.version.outputs.version }}" \
            --goarch "${{ matrix.goarch }}" \
            --output-dir "$PWD/dist/release")"
          echo "basename=${BASENAME}" >> "$GITHUB_OUTPUT"

      - name: Upload Linux package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.basename }}
          path: |
            dist/release/${{ steps.package.outputs.basename }}.tar.gz
            dist/release/${{ steps.package.outputs.basename }}.tar.gz.sha256

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f -name '*.tar.gz' -exec cp {} release/ \;
          find artifacts -type f -name '*.tar.gz.sha256' -exec cp {} release/ \;
          cd release
          sha256sum *.tar.gz > SHA256SUMS.txt

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > "${NOTES_FILE}"
          for heading in "## Highlights" "## Operator impact" "## Validation"; do
            if ! grep -F "${heading}" "${NOTES_FILE}" >/dev/null; then
              echo "::error::release notes from ${GITHUB_REF_NAME} are missing ${heading}"
              sed -n '1,120p' "${NOTES_FILE}"
              exit 1
            fi
          done
          gh release create "${GITHUB_REF_NAME}" release/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "${NOTES_FILE}" \
            --verify-tag
