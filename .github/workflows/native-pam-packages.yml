name: Native PAM Package Gates

on:
  workflow_dispatch:
  schedule:
    - cron: "37 3 * * 2"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ubuntu-deb-package:
    name: Ubuntu .deb Package
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          check-latest: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install PAM build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential gcc libpam0g-dev pkg-config

      - name: Run Ubuntu .deb package smoke
        run: make native-pam-ubuntu-deb-package-smoke

  docker-native-pam-packages:
    name: Docker Native PAM Packages
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          check-latest: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Install release verification dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zstd

      - name: Run direct native PAM distro smoke
        run: ./scripts/native-pam-distro-smoke.sh --platform linux/amd64

      - name: Run Arch package smoke
        run: ./scripts/native-pam-arch-package-smoke.sh --platform linux/amd64

      - name: Run Alpine package smoke
        run: ./scripts/native-pam-alpine-package-smoke.sh --platform linux/amd64

      - name: Run native PAM arm64 release asset smoke
        run: |
          scripts/build-native-pam-release-assets.sh \
            --version 0.0.0 \
            --output-dir dist/native-pam-arm64-smoke \
            --build-time 2026-05-03T00:00:00Z \
            --source-date-epoch 1777766400 \
            --platform linux/arm64
